<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Capture</title>
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 48, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --text-muted: #8b9bb4;
      --input-bg: rgba(11, 15, 25, 0.8);
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
      font-family: 'Outfit', sans-serif;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }

    .capture-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .capture-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-control, .form-select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      background-color: var(--input-bg);
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      outline: none;
    }

    .form-control::placeholder {
      color: #4b5563;
    }

    textarea.form-control {
      resize: none;
      min-height: 140px;
    }

    /* Style calendar icon color for dark mode input */
    input[type="datetime-local"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    /* Styled dropdown option items inside default browser dropdown */
    .form-select option {
      background-color: #111827;
      color: #ffffff;
    }

    .btn-submit {
      background: var(--accent-gradient);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.875rem;
      border-radius: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .footer-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <main class="capture-card">
    <div class="d-flex align-items-center mb-4">
      <div class="bg-indigo-soft me-3 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; background: rgba(99, 102, 241, 0.15); border-radius: 10px;">
        <i class="bi bi-lightning-charge-fill text-indigo" style="font-size: 1.25rem; color: #818cf8;"></i>
      </div>
      <h1 class="card-title m-0">Quick Capture</h1>
    </div>

    <form id="captureForm">
      <div class="mb-4">
        <label for="captureText" class="form-label">Insight / Ideia / Tarefa</label>
        <textarea 
          class="form-control" 
          id="captureText" 
          placeholder="Digite seu insight, ideia ou tarefa aqui..." 
          required></textarea>
      </div>

      <div class="mb-4">
        <label for="captureCategory" class="form-label">Categoria</label>
        <select class="form-select" id="captureCategory" required>
          <option value="" disabled selected hidden>Selecione uma categoria...</option>
          <option value="Empreendedorismo">Empreendedorismo</option>
          <option value="Automação">Automação</option>
          <option value="Desenvolvimento">Desenvolvimento</option>
          <option value="Pessoal">Pessoal</option>
        </select>
      </div>

      <div class="mb-4" id="agendamentoContainer">
        <div class="row g-2">
          <div class="col-12 mb-2">
            <label for="data-agendamento" class="form-label">Data do Agendamento</label>
            <input type="date" class="form-control" id="data-agendamento">
          </div>
          <div class="col-6">
            <label for="hora-inicial" class="form-label">Horário Inicial</label>
            <input type="time" class="form-control" id="hora-inicial">
          </div>
          <div class="col-6">
            <label for="hora-termino" class="form-label">Horário de Término</label>
            <input type="time" class="form-control" id="hora-termino">
          </div>
        </div>
      </div>

      <button type="submit" id="submitButton" class="btn btn-submit w-100 d-flex align-items-center justify-content-center">
        <span>Confirmar Insight</span>
        <i class="bi bi-arrow-right-short ms-2" style="font-size: 1.25rem;"></i>
      </button>
    </form>

    <div class="footer-note">
      Conectado à sua caixa de entrada local.
    </div>
  </main>

  <!-- Script JS -->

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important; border-radius: 12px;">
      <div class="d-flex">
        <div class="toast-body">
          <strong class="d-block mb-1" id="toastTitle">✅ Registrado no Telegram!</strong>
          <div id="toastMessage"></div>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    <div id="errorToast" class="toast align-items-center text-white bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%) !important; border-radius: 12px;">
      <div class="d-flex">
        <div class="toast-body">
          <strong class="d-block mb-1">⚠️ Não foi possível registrar</strong>
          <div id="errorToastMessage"></div>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsnUH2mnNbFjkRgX02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+7" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
